name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          set -e
          name="astrbot_plugin_dsh_bridge"
          tag="${GITHUB_REF_NAME}"
          mkdir -p "/tmp/pkg/${name}"
          rsync -a \
            --exclude '.git' \
            --exclude '__pycache__' \
            --exclude 'state.json' \
            --exclude '*.pyc' \
            ./ "/tmp/pkg/${name}/"
          cd /tmp/pkg
          zip -r "${name}-${tag}.zip" "${name}"
          ls -l "${name}-${tag}.zip"

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pkg/astrbot_plugin_dsh_bridge-${{ github.ref_name }}.zip
          generate_release_notes: true
